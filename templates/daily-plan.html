<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 700px; margin: 0 auto; padding: 20px; }
    h1 { color: #2c3e50; font-size: 24px; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
    h2 { color: #34495e; font-size: 18px; margin-top: 25px; }
    .focus { background: #e8f4f8; padding: 15px; border-radius: 4px; margin: 15px 0; }
    .blocker { background: #f8d7da; padding: 10px; border-left: 4px solid #e74c3c; margin: 10px 0; }
    .footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Daily Plan - {{DATE}}</h1>

  <div class="focus">
    {{CONTENT}}
  </div>

  {{#if BLOCKERS}}
  <div class="blocker">
    <strong>Blockers:</strong> {{BLOCKERS}}
  </div>
  {{/if}}

  <div class="footer">
    Generated by Claude Code
  </div>
</body>
</html>
